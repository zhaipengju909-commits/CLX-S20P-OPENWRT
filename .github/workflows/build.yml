name: Build CLX S20P (official OpenWrt)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "OpenWrt branch or tag to build"
        required: true
        default: "openwrt-25.12"
      config_only:
        description: "Stop after .config checks (fast test, no firmware)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      BRANCH: ${{ inputs.branch }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout this repository (full-cone patches and package files)
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools libelf-dev rsync swig unzip \
            zlib1g-dev file wget zstd

      - name: Clone official OpenWrt
        run: |
          git clone --depth 1 --branch "$BRANCH" https://github.com/openwrt/openwrt.git openwrt
          git -C openwrt log -1 --format='%H %ad %s' | tee upstream-commit.txt

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
          key: ${{ runner.os }}-openwrt-dl-${{ inputs.branch }}-${{ hashFiles('openwrt/feeds.conf.default') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-dl-${{ inputs.branch }}-
            ${{ runner.os }}-openwrt-dl-

      - name: Add S20P support
        run: |
          set -euo pipefail
          ROOT="$PWD"
          T=target/linux/mediatek
          VIKING_SHA=0b433e656fd6886aa2f32f923c8d2d8dfc94835e

          # 1) Fetch the S20P device tree from VIKINGYFY/immortalwrt at a pinned commit
          rm -rf "$ROOT/viking-src" && mkdir "$ROOT/viking-src" && cd "$ROOT/viking-src"
          git init -q
          git remote add origin https://github.com/VIKINGYFY/immortalwrt.git
          git fetch -q --depth 1 origin "$VIKING_SHA" || git fetch -q --depth 1 origin owrt
          git checkout -q FETCH_HEAD -- \
            $T/dts/mt7986a-supergateway-s20-common.dtsi \
            $T/dts/mt7986a-supergateway-s20p.dts
          cd "$ROOT/openwrt"

          # 2) Rename to the CLX board (board name clx,s20p, same as the CLX firmware)
          sed 's/supergateway/clx/g' "$ROOT/viking-src/$T/dts/mt7986a-supergateway-s20-common.dtsi" > $T/dts/mt7986a-clx-s20-common.dtsi
          sed -e 's/mt7986a-supergateway-s20-common/mt7986a-clx-s20-common/' \
              -e 's/"Super Gateway S20P"/"CLX S20P"/' \
              -e 's/"supergateway,s20p"/"clx,s20p"/' \
              "$ROOT/viking-src/$T/dts/mt7986a-supergateway-s20p.dts" > $T/dts/mt7986a-clx-s20p.dts
          if grep -n 'supergateway\|Super Gateway' $T/dts/mt7986a-clx-s20-common.dtsi $T/dts/mt7986a-clx-s20p.dts; then
            echo "leftover vendor names in dts"; exit 1
          fi

          # 3) Register the device (image, LEDs, network ports, eMMC upgrade)
          python3 - <<'PY'
          T = 'target/linux/mediatek/'

          def edit(path, old, new, count=1):
              s = open(path).read()
              assert s.count(old) == count, (path, old, s.count(old))
              open(path, 'w').write(s.replace(old, new))

          edit(T + 'filogic/base-files/lib/upgrade/platform.sh',
               "\tarcadyan,mozart|\\\n",
               "\tarcadyan,mozart|\\\n\tclx,s20p|\\\n", count=2)

          old = "\tasiarf,ap7986-003|\\\n\tasus,tuf-ax4200q|\\\n"
          edit(T + 'filogic/base-files/etc/board.d/02_network', old,
               '\tclx,s20p)\n\t\tucidef_set_interfaces_lan_wan "lan1 lan2 lan3 lan4 lan5 lan6" eth1\n\t\t;;\n' + old)

          old = "case $board in\nairpi,ap3000m)\n"
          leds = ('clx,s20p)\n'
                  '\tucidef_set_led_netdev "wlan5g" "WLAN5G" "blue:wlan-5ghz" "phy1-ap0"\n'
                  '\tucidef_set_led_netdev "wlan2g" "WLAN2G" "blue:wlan-2ghz" "phy0-ap0"\n'
                  '\tucidef_set_led_timer "sys" "SYS" "blue:status" "1000" "2000"\n'
                  '\t;;\n')
          edit(T + 'filogic/base-files/etc/board.d/01_leds', old,
               "case $board in\n" + leds + "airpi,ap3000m)\n")

          old = "TARGET_DEVICES += cetron_ct3003\n\n"
          dev = ('define Device/clx_s20p\n'
                 '  DEVICE_VENDOR := CLX\n'
                 '  DEVICE_MODEL := S20P\n'
                 '  DEVICE_DTS := mt7986a-clx-s20p\n'
                 '  DEVICE_DTS_DIR := ../dts\n'
                 '  DEVICE_PACKAGES := kmod-mt7915e kmod-mt7916-firmware kmod-mt7986-firmware mt7986-wo-firmware \\\n'
                 '    kmod-usb3 kmod-mmc kmod-nvme kmod-fs-f2fs kmod-fs-ext4 kmod-fs-vfat \\\n'
                 '    mkf2fs f2fsck e2fsprogs blkid blockdev losetup automount\n'
                 '  IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata\n'
                 'endef\n'
                 'TARGET_DEVICES += clx_s20p\n\n')
          edit(T + 'image/filogic.mk', old, old + dev)
          print("S20P device registered")
          PY

      - name: Set default LAN address and root password
        working-directory: openwrt
        run: |
          set -euo pipefail
          # Default LAN address 192.168.2.1 (official default is 192.168.1.1)
          sed -i 's/192\.168\.1\.1/192.168.2.1/g' package/base-files/files/bin/config_generate
          grep -q '192\.168\.2\.1' package/base-files/files/bin/config_generate
          # Default root password "openwrt" (SHA-512 hash written into the default shadow file)
          HASH="$(openssl passwd -6 openwrt)"
          HASH="$HASH" python3 - <<'PY2'
          import os
          p = "package/base-files/files/etc/shadow"
          lines = open(p).read().splitlines()
          out = []
          for l in lines:
              if l.startswith("root:"):
                  f = l.split(":")
                  f[1] = os.environ["HASH"]
                  l = ":".join(f)
              out.append(l)
          open(p, "w").write("\n".join(out) + "\n")
          PY2
          grep '^root:' package/base-files/files/etc/shadow | cut -c1-20
          # Build identifier so /etc/s20p-build tells which image is running
          mkdir -p files/etc
          printf 'S20P build: b%s / %s / workflow run %s\n' \
            "$GITHUB_RUN_NUMBER" "$BRANCH" "$GITHUB_RUN_ID" > files/etc/s20p-build
          cat files/etc/s20p-build

      - name: First-boot defaults (CGNAT UPnP fix, CLX defaults)
        working-directory: openwrt
        run: |
          set -euo pipefail
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-upnpd-cgnat <<'EOS'
          #!/bin/sh
          # Official miniupnpd init script ignores the UCI option
          # ext_allow_private_ipv4. With a CGNAT WAN (100.64.0.0/10) miniupnpd
          # then logs "Port forwarding is impossible" and rejects every
          # AddPortMapping / NAT-PMP request. Patch it once at first boot.
          INIT=/etc/init.d/miniupnpd
          [ -x "$INIT" ] || exit 0
          grep -q 'ext_allow_private_ipv4=yes' "$INIT" && exit 0
          cp "$INIT" "${INIT}.bak-natfix" 2>/dev/null || true
          awk '{
            print
            if ($0 ~ /config_get ipv6_disable config ipv6_disable/) print "\tconfig_get_bool allow_private_ipv4 config ext_allow_private_ipv4 0"
            if ($0 ~ /upnpd_write_bool ipv6_disable/) print "\t[ \"$allow_private_ipv4\" -eq 0 ] || echo \"ext_allow_private_ipv4=yes\""
          }' "$INIT" > "${INIT}.new" && mv "${INIT}.new" "$INIT" && chmod +x "$INIT"
          uci set upnpd.config.ext_allow_private_ipv4='1'
          uci commit upnpd
          /etc/init.d/miniupnpd restart >/dev/null 2>&1 || true
          EOS
          chmod +x files/etc/uci-defaults/99-upnpd-cgnat
          # CLX defaults (maintainer's decision): hardware flow offloading on, full-cone NAT on, UPnP on, and the data
          # partition p7 mounted at /mnt/data (matched by device, never formatted). Details in the script itself.
          cp "$GITHUB_WORKSPACE/files/etc/uci-defaults/99-clx-s20p-defaults" files/etc/uci-defaults/
          chmod 755 files/etc/uci-defaults/99-clx-s20p-defaults
          ls -l files/etc/uci-defaults/

      - name: Add full-cone NAT (nftables fullcone, patches adapted from ImmortalWrt)
        working-directory: openwrt
        run: |
          set -euo pipefail
          FC="$GITHUB_WORKSPACE/fullcone"
          LIBNFTNL_VER="$(sed -n 's/^PKG_VERSION:=//p' package/libs/libnftnl/Makefile)"
          NFT_VER="$(sed -n 's/^PKG_VERSION:=//p' package/network/utils/nftables/Makefile)"
          FW4_SHA="$(sed -n 's/^PKG_SOURCE_VERSION:=//p' package/network/config/firewall4/Makefile)"
          echo "upstream versions in this tree: libnftnl=$LIBNFTNL_VER nftables=$NFT_VER firewall4=$FW4_SHA"
          T="$(mktemp -d)"
          dl() { for i in 1 2 3 4; do curl -fsSL -m 120 -o "$2" "$1" && return 0; sleep 3; done; return 1; }
          # Preflight: every patch must apply cleanly to the exact upstream sources, after the patches official OpenWrt already carries.
          # If official openwrt-25.12 moves to other versions, stop here instead of building a broken firewall.
          dl "https://sources.cdn.openwrt.org/libnftnl-$LIBNFTNL_VER.tar.xz" "$T/nl.tar.xz" || dl "https://netfilter.org/projects/libnftnl/files/libnftnl-$LIBNFTNL_VER.tar.xz" "$T/nl.tar.xz"
          tar -C "$T" -xf "$T/nl.tar.xz"
          (cd "$T/libnftnl-$LIBNFTNL_VER" \
            && for p in $(ls "$OLDPWD/package/libs/libnftnl/patches"/*.patch 2>/dev/null | sort); do patch -p1 -s < "$p"; done \
            && patch -p1 --dry-run < "$FC/libnftnl/100-libnftnl-add-fullcone-expression-support.patch")
          dl "https://sources.cdn.openwrt.org/nftables-$NFT_VER.tar.xz" "$T/nft.tar.xz" || dl "https://netfilter.org/projects/nftables/files/nftables-$NFT_VER.tar.xz" "$T/nft.tar.xz"
          tar -C "$T" -xf "$T/nft.tar.xz"
          (cd "$T/nftables-$NFT_VER" \
            && for p in $(ls "$OLDPWD/package/network/utils/nftables/patches"/*.patch 2>/dev/null | sort); do patch -p1 -s < "$p"; done \
            && patch -p1 --dry-run < "$FC/nftables/100-nftables-add-fullcone-expression-support.patch")
          git clone -q https://github.com/openwrt/firewall4.git "$T/fw4"
          git -C "$T/fw4" checkout -q "$FW4_SHA"
          (cd "$T/fw4" \
            && for p in $(ls "$OLDPWD/package/network/config/firewall4/patches"/*.patch 2>/dev/null | sort); do git apply "$p"; done \
            && git apply --check "$FC/firewall4/100-firewall4-add-support-for-fullcone-nat.patch")
          echo "preflight OK: all full-cone patches apply cleanly"
          # Kernel patch: let several modules register for conntrack events (CONFIG_NF_CONNTRACK_CHAIN_EVENTS).
          # nft_fullcone needs it; without it nft_fullcone and nf_conntrack_netlink fight over the single notifier slot
          # (kernel WARNING in nf_conntrack_register_notifier, full-cone loses its events). Official OpenWrt lacks this patch,
          # ImmortalWrt carries it in target/linux/generic/hack-6.12 (same kernel 6.12.116).
          KP="$FC/kernel/952-net-conntrack-events-support-multiple-registrant.patch"
          KVER="$(sed -n 's/^LINUX_VERSION-6\.12 = //p' target/linux/generic/kernel-6.12)"
          KHASH="$(awk -v k="LINUX_KERNEL_HASH-6.12$KVER" '$1==k {print $3}' target/linux/generic/kernel-6.12)"
          echo "kernel: 6.12$KVER (sha256 $KHASH)"
          dl "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12$KVER.tar.xz" "$T/linux.tar.xz" || dl "https://sources.cdn.openwrt.org/linux-6.12$KVER.tar.xz" "$T/linux.tar.xz"
          echo "$KHASH  $T/linux.tar.xz" | sha256sum -c -
          tar -C "$T" -xf "$T/linux.tar.xz"
          KDIR="$T/linux-6.12$KVER"; KOK=1
          for d in backport-6.12 pending-6.12 hack-6.12; do
            for p in $(ls "$PWD/target/linux/generic/$d"/*.patch 2>/dev/null | sort); do
              (cd "$KDIR" && patch -p1 -s -N --no-backup-if-mismatch < "$p" > /dev/null 2>&1) || { echo "note: official kernel patch did not apply in preflight: $p"; KOK=0; }
            done
          done
          if [ "$KOK" = 1 ]; then
            (cd "$KDIR" && patch -p1 --dry-run < "$KP") || { echo "ERROR: kernel conntrack-events patch does not apply to 6.12$KVER"; exit 1; }
            echo "preflight OK: kernel conntrack-events patch applies to 6.12$KVER"
          else
            echo "WARNING: kernel preflight inconclusive (an official patch did not apply on the bare tarball); the real build will decide"
          fi
          cp "$KP" target/linux/generic/hack-6.12/
          ls target/linux/generic/hack-6.12 | grep -E '^952-'
          # Install into the tree
          for pair in "libnftnl:package/libs/libnftnl" "nftables:package/network/utils/nftables" "firewall4:package/network/config/firewall4"; do
            src="${pair%%:*}"; dst="${pair#*:}"
            mkdir -p "$dst/patches"
            cp "$FC/$src"/*.patch "$dst/patches/"
          done
          # The libnftnl patch edits src/Makefile.am, so the package must regenerate its autotools files
          # (ImmortalWrt's libnftnl Makefile carries PKG_FIXUP:=autoreconf for the same reason; official does not).
          grep -q '^PKG_FIXUP:=autoreconf' package/libs/libnftnl/Makefile || sed -i 's/^PKG_INSTALL:=1$/PKG_FIXUP:=autoreconf\nPKG_INSTALL:=1/' package/libs/libnftnl/Makefile
          grep -q '^PKG_FIXUP:=autoreconf' package/libs/libnftnl/Makefile || { echo "ERROR: could not enable autoreconf for libnftnl"; exit 1; }
          grep -q '^PKG_FIXUP:=autoreconf' package/network/utils/nftables/Makefile || { echo "ERROR: nftables Makefile has no autoreconf"; exit 1; }
          rm -rf package/network/utils/fullconenat-nft
          cp -r "$FC/fullconenat-nft" package/network/utils/fullconenat-nft
          ls package/libs/libnftnl/patches package/network/utils/nftables/patches package/network/config/firewall4/patches package/network/utils/fullconenat-nft

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add extra plugins (store, quickstart, aurora theme, disk manager)
        working-directory: openwrt
        run: |
          set -euo pipefail
          mkdir -p package/extra && cd package/extra
          # Every third-party source is pinned to a commit that is known to build.
          # (An unpinned quickstart once switched to an apk-invalid version string and broke the build.)
          pin() {  # pin <url> <sha> <dir> [sparse paths...]
            url="$1"; sha="$2"; dir="$3"; shift 3
            git init -q "$dir"
            git -C "$dir" remote add origin "$url"
            if [ "$#" -gt 0 ]; then
              git -C "$dir" fetch -q --depth 1 --filter=blob:none origin "$sha"
              git -C "$dir" sparse-checkout set --no-cone "$@"
            else
              git -C "$dir" fetch -q --depth 1 origin "$sha"
            fi
            git -C "$dir" checkout -q FETCH_HEAD
          }
          # iStore store + its helpers
          pin https://github.com/linkease/istore.git a97ace34f2da358a015b094d326bba2697697f2e _istore
          cp -r _istore/luci/luci-app-store _istore/luci/luci-lib-taskd _istore/luci/luci-lib-xterm _istore/luci/taskd .
          rm -rf _istore
          # iStore's installer (is-opkg) tries the mirror repo.istoreos.com first. From this network the mirror was measured
          # at 0.5 MB in 97 s and then dropped, while the origin istore.istoreos.com gave 3.3 MB in 35 s, so installs failed.
          # Empty both mirror lists: the script then skips the mirror loop and goes straight to the origin server.
          sed -i 's|^\( *FEEDS_SERVER_MIRRORS=\).*|\1""|' luci-app-store/root/bin/is-opkg
          [ "$(grep -c '^ *FEEDS_SERVER_MIRRORS=""$' luci-app-store/root/bin/is-opkg)" = 2 ] \
            || { echo "ERROR: is-opkg mirror patch did not apply (expected 2 lines)"; exit 1; }
          # Quickstart dashboard (sparse checkout from small-package)
          pin https://github.com/kenzok8/small-package.git 115c2ad528594ce47e5188e79c797b8222b9b35d _sp /quickstart /luci-app-quickstart
          cp -r _sp/quickstart _sp/luci-app-quickstart .
          rm -rf _sp
          # Mini disk manager
          pin https://github.com/4IceG/luci-app-mini-diskmanager.git 4b2b7332896063ef888f34da2187c3cc6f366037 _mdm
          cp -r _mdm/luci-app-mini-diskmanager .
          rm -rf _mdm
          # Theme: Aurora (+ config app)
          pin https://github.com/eamonxg/luci-theme-aurora.git 298dbcc74ddf820923a51285fb0826d429e5d7ca luci-theme-aurora
          pin https://github.com/eamonxg/luci-app-aurora-config.git a5299ce0144859f47683ec3bc40805bf616f534f luci-app-aurora-config
          rm -rf luci-theme-aurora/.git luci-app-aurora-config/.git
          # FullCone NAT settings page (Network -> Firewall -> FullCone NAT). Official LuCI has no such switch.
          # Source is vendored in this repo (package-extra/luci-app-fullcone, from akorshun/fullcone-openwrt, Apache-2.0).
          cp -r "$GITHUB_WORKSPACE/package-extra/luci-app-fullcone" .
          # Third-party sources arrive with leftover patch rejects (luci-app-quickstart ships luasrc/controller/quickstart.lua.rej,
          # which then lands in the image). Drop reject/backup files from the copied sources before they are packaged.
          find . \( -name '*.rej' -o -name '*.orig' \) -print -delete
          ls
          grep -H -E '^PKG_VERSION' luci-app-quickstart/Makefile quickstart/Makefile luci-app-store/Makefile

      - name: Write .config
        working-directory: openwrt
        run: |
          cat > .config <<'CFG'
          # CLX S20P (MT7986A / 2GiB / eMMC) -- official OpenWrt, stock LuCI layout, all kernel modules
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_MULTI_PROFILE=n
          CONFIG_TARGET_ALL_PROFILES=n
          CONFIG_TARGET_mediatek_filogic_DEVICE_clx_s20p=y

          # Build every kernel module as an installable package (so any kmod can be installed later)
          CONFIG_ALL_KMODS=y

          # Stock LuCI: default theme and menu layout (plugins live under Services)
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y

          # A few common official apps (all appear under the stock menus)
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
          CONFIG_PACKAGE_luci-proto-wireguard=y

          # Extra official apps
          # Needed by third-party Lua LuCI apps (e.g. homebox from iStore: module 'luci.cbi' not found)
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
          CONFIG_PACKAGE_luci-app-samba4=y
          CONFIG_PACKAGE_luci-i18n-samba4-zh-cn=y
          CONFIG_PACKAGE_samba4-server=y
          # FullCone NAT settings page (source in package-extra/luci-app-fullcone; its zh-cn translation is built with it)
          CONFIG_PACKAGE_luci-app-fullcone=y

          # Third-party apps kept per user choice (sources cloned into package/extra)
          CONFIG_PACKAGE_xz-utils=y
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-app-quickstart=y
          CONFIG_PACKAGE_luci-app-mini-diskmanager=y
          CONFIG_PACKAGE_luci-theme-aurora=y
          CONFIG_PACKAGE_luci-app-aurora-config=y

          # Storage / M.2 / USB
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y

          # Handy tools
          CONFIG_PACKAGE_kmod-tcp-bbr=y
          CONFIG_PACKAGE_ethtool=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_irqbalance=y

          # Full-cone NAT kernel module (patches in fullcone/; on by default, see 99-clx-s20p-defaults) and SFTP server (so scp works with dropbear)
          CONFIG_PACKAGE_kmod-nft-fullcone=y
          CONFIG_PACKAGE_openssh-sftp-server=y

          # Kernel modules that proxy plugins (PassWall2 / OpenClash) and dnsmasq-full need. Official package feeds do not carry
          # kmods for our kernel hash, so put them in the image; the userspace packages can then be installed from official feeds.
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-nf-conntrack-netlink=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-netlink-diag=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          # busybox has no nohup
          CONFIG_PACKAGE_coreutils-nohup=y
          # conntrack CLI (source package conntrack-tools defines Package/conntrack)
          CONFIG_PACKAGE_conntrack=y
          CFG
          set +e
          make defconfig > /tmp/defconfig.log 2>&1
          rc=$?
          set -e
          echo "make defconfig exit code: $rc"
          grep -v -E 'recursive dependency|kbuild|kconfig-language|Kconfig recursive|^$' /tmp/defconfig.log | tail -n 30 || true
          echo "--- selected key symbols ---"
          grep -E 'DEVICE_clx_s20p|^CONFIG_ALL_KMODS|^CONFIG_PACKAGE_luci=|^CONFIG_TARGET_(mediatek|BOARD)' .config || true
          fail=0
          chk() { grep -q "$1" .config || { echo "CHECK FAILED: $1"; fail=1; }; }
          chk '^CONFIG_TARGET_mediatek_filogic_DEVICE_clx_s20p=y'
          chk '^CONFIG_ALL_KMODS=y'
          chk '^CONFIG_PACKAGE_luci=y'
          chk '^CONFIG_PACKAGE_conntrack=y'
          [ "$fail" = 0 ] || exit 1
          # Report leftover patch rejects; do not fail the build yet
          if find . -name '*.rej' -print -quit | grep -q .; then
            echo 'PATCH REJECT DETECTED'
            find . -name '*.rej' | head -20
          fi
          # Third-party plugins are best effort: report what was dropped, but do not fail the build
          for p in luci-app-store luci-app-quickstart luci-app-mini-diskmanager luci-theme-aurora luci-app-aurora-config luci-app-ttyd luci-app-samba4 luci-compat kmod-nft-fullcone openssh-sftp-server kmod-tun kmod-nf-conntrack-netlink kmod-inet-diag kmod-netlink-diag kmod-nft-tproxy coreutils-nohup luci-app-fullcone samba4-server conntrack; do
            if grep -q "^CONFIG_PACKAGE_$p=y" .config; then echo "plugin ok: $p"; else echo "PLUGIN DROPPED: $p"; fi
          done
          for p in luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn luci-i18n-package-manager-zh-cn luci-i18n-upnp-zh-cn luci-i18n-samba4-zh-cn luci-i18n-fullcone-zh-cn; do
            if grep -q "^CONFIG_PACKAGE_$p=y" .config; then echo "langpack ok: $p"; else echo "LANGPACK DROPPED: $p"; fi
          done
          echo '--- luci-app-store config entry ---'; grep -n -A12 'config PACKAGE_luci-app-store$' tmp/.config-package.in | head -30 || true
          grep -n -A12 '^Package: luci-app-store$' tmp/.packageinfo | head -20 || true
          for d in curl tar libuci-lua mount-utils luci-lib-taskd luci-lib-xterm taskd procd script-utils coreutils coreutils-stty quickstart ucode-mod-math; do
            if grep -q "^Package: $d$" tmp/.packageinfo; then echo "dep ok: $d"; else echo "DEP MISSING: $d"; fi
          done

      - name: Download sources
        if: ${{ !inputs.config_only }}
        working-directory: openwrt
        run: make download -j8

      - name: Build
        if: ${{ !inputs.config_only }}
        working-directory: openwrt
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: Verify defaults inside the built rootfs
        if: ${{ !inputs.config_only }}
        run: |
          R="$(ls -d openwrt/build_dir/target-*/root-* 2>/dev/null | head -1)"
          echo "rootfs dir: $R"
          grep -n '192\.168\.2\.1' "$R/bin/config_generate" | head -3 || echo "VERIFY FAILED: lan ip"
          grep -q '^root:\$6\$' "$R/etc/shadow" && echo "verify ok: root password hash present" || echo "VERIFY FAILED: root password"
          [ -f "$R/usr/share/firewall4/templates/zone-fullcone.uc" ] && echo "verify ok: firewall4 fullcone template" || echo "VERIFY FAILED: firewall4 fullcone template"
          grep -q 'fullcone' "$R/usr/share/ucode/fw4.uc" && echo "verify ok: fw4.uc knows fullcone" || echo "VERIFY FAILED: fw4.uc fullcone"
          grep -aq 'fullcone' "$R"/usr/lib/libnftnl.so* && echo "verify ok: libnftnl has fullcone" || echo "VERIFY FAILED: libnftnl fullcone"
          grep -aq 'fullcone' "$R"/usr/lib/libnftables.so* && echo "verify ok: libnftables (nft) has fullcone" || echo "VERIFY FAILED: libnftables fullcone"
          ls openwrt/bin/targets/mediatek/filogic/packages/kmod-nft-fullcone-*.apk >/dev/null 2>&1 && echo "verify ok: kmod-nft-fullcone package built" || echo "VERIFY FAILED: kmod-nft-fullcone package"
          [ -f "$R/usr/libexec/sftp-server" ] && echo "verify ok: sftp-server in image" || echo "VERIFY FAILED: sftp-server"
          KC="$(ls openwrt/build_dir/target-*/linux-mediatek_filogic/linux-*/.config 2>/dev/null | head -1)"
          echo "kernel config: $KC"
          grep -q '^CONFIG_NF_CONNTRACK_CHAIN_EVENTS=y' "$KC" && echo "verify ok: kernel has NF_CONNTRACK_CHAIN_EVENTS" || echo "VERIFY FAILED: kernel NF_CONNTRACK_CHAIN_EVENTS"
          grep -q '^CONFIG_NF_CONNTRACK_EVENTS=y' "$KC" && echo "verify ok: kernel has NF_CONNTRACK_EVENTS" || echo "VERIFY FAILED: kernel NF_CONNTRACK_EVENTS"
          # /usr/bin/nohup is a symlink to an absolute in-image path (/usr/libexec/nohup-coreutils): test the link and its target separately
          [ -L "$R/usr/bin/nohup" ] && [ -e "$R/usr/libexec/nohup-coreutils" ] && echo "verify ok: nohup in image" || echo "VERIFY FAILED: nohup"
          [ -s "$R/etc/uci-defaults/99-clx-s20p-defaults" ] && echo "verify ok: CLX first-boot defaults script in image" || echo "VERIFY FAILED: CLX first-boot defaults script"
          [ -s "$R/etc/uci-defaults/99-upnpd-cgnat" ] && echo "verify ok: CGNAT UPnP fix script in image" || echo "VERIFY FAILED: CGNAT UPnP fix script"
          [ -s "$R/etc/s20p-build" ] && { echo "verify ok: build id file:"; cat "$R/etc/s20p-build"; } || echo "VERIFY FAILED: /etc/s20p-build"
          [ -z "$(find "$R" -name '*.rej' -o -name '*.orig' 2>/dev/null | head -1)" ] && echo "verify ok: no patch rejects in image" || { echo "VERIFY FAILED: patch rejects in image:"; find "$R" -name '*.rej' -o -name '*.orig' | head -5; }
          [ "$(grep -c '^ *FEEDS_SERVER_MIRRORS=""$' "$R/bin/is-opkg" 2>/dev/null)" = 2 ] && echo "verify ok: iStore installer goes straight to the origin server" || echo "VERIFY FAILED: is-opkg mirror patch"
          [ -s "$R/usr/share/luci/menu.d/luci-app-fullcone.json" ] && [ -s "$R/www/luci-static/resources/view/fullcone/settings.js" ] && echo "verify ok: luci-app-fullcone in image" || echo "VERIFY FAILED: luci-app-fullcone"
          [ -n "$(find "$R" -path '*i18n*' -name '*fullcone*' 2>/dev/null | head -1)" ] && echo "verify ok: luci-app-fullcone translation in image" || echo "VERIFY FAILED: fullcone translation"
          [ -x "$R/usr/sbin/smbd" ] && echo "verify ok: samba (smbd) in image" || echo "VERIFY FAILED: smbd"
          [ -x "$R/usr/sbin/conntrack" ] && echo "verify ok: conntrack CLI in image" || echo "VERIFY FAILED: conntrack CLI"
          grep -E "flow_offloading|fullcone" "$R/etc/config/firewall" | tr -s '\t ' ' ' | head -6
          ls "$R"/lib/modules/*/nft_fullcone.ko "$R"/lib/modules/*/nf_conntrack_netlink.ko "$R"/lib/modules/*/tun.ko >/dev/null 2>&1 && echo "verify ok: nft_fullcone, nf_conntrack_netlink, tun modules in image" || echo "VERIFY FAILED: kernel modules in image"

      - name: Collect artifacts
        if: ${{ !inputs.config_only }}
        run: |
          set -euo pipefail
          VER="${BRANCH#openwrt-}"
          BUILD="b${{ github.run_number }}"
          UP="$(git -C openwrt rev-parse --short=7 HEAD)"
          DATE="$(date -u +%Y%m%d)"
          NAME="CLX-S20P-OpenWrt-${VER}-${BUILD}-${DATE}-${UP}"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "UP=$UP" >> "$GITHUB_ENV"
          mkdir -p out
          T=openwrt/bin/targets/mediatek/filogic
          cp "$T"/*clx_s20p*sysupgrade.bin "out/${NAME}-sysupgrade.bin"
          cp "$T"/*clx_s20p*.manifest "out/${NAME}.manifest"
          cp upstream-commit.txt out/
          cp openwrt/.config "out/${NAME}.config"
          tar -C "$T" -I 'zstd -T0 -10' -cf "out/${NAME}-packages.tar.zst" packages
          (cd out && sha256sum "${NAME}-sysupgrade.bin" > "${NAME}.sha256")
          # initramfs (RAM-boot test image): kept as a workflow artifact, not published in the release
          mkdir -p ram
          cp "$T"/*clx_s20p*initramfs-kernel.bin "ram/${NAME}-initramfs-kernel.bin"
          (cd ram && sha256sum "${NAME}-initramfs-kernel.bin" > "${NAME}-initramfs.sha256")
          ls -lh out ram
          cat "out/${NAME}.sha256"

      - name: Upload initramfs test image (workflow artifact)
        if: ${{ !inputs.config_only }}
        uses: actions/upload-artifact@v4
        with:
          name: initramfs-${{ env.NAME }}
          path: ram/*
          retention-days: 14

      - name: Upload release payload (workflow artifact, survives a failed publish)
        if: ${{ !inputs.config_only }}
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.NAME }}
          path: out/*
          retention-days: 14
          if-no-files-found: error

      - name: Publish release
        if: ${{ !inputs.config_only }}
        run: |
          TAG="$NAME"
          cat > notes.md <<NOTES
          ## CLX S20P - official OpenWrt (experimental)

          **This is a practice project, tested only on the maintainer's own S20P. Earlier builds booted there and were used for PPPoE, LAN, full-cone NAT rules, Samba, iStore and proxy-plugin installs; this build has not been verified on your hardware, and things not listed here (hardware offload throughput, Wi-Fi, M.2, buttons) have not been verified at all. Flashing may leave the device unusable. Use at your own risk, and only if you can recover the device yourself (U-Boot / serial). No warranty of any kind.**

          **这是练手项目，只在维护者自己的一台 S20P 上测试过。之前的版本在那台机器上能开机，并用过 PPPoE 拨号、LAN、全锥形 NAT 规则、Samba、iStore 以及代理插件的安装；这个版本没有在你的硬件上验证过，没列出来的功能（硬件卸载吞吐、Wi-Fi、M.2、按键）完全没有验证。刷机可能导致设备无法启动，风险自负；请先备份并确认自己有恢复手段（U-Boot / 串口）。不提供任何担保。**

          - Build / 构建号: $BUILD ($NAME)
          - Management address / 管理地址: http://192.168.2.1
          - Username / 用户名: root, Password / 密码: openwrt  (change it right after first login / 登录后请立即修改)
          - Board name / 机型标识: clx,s20p (CLX S20P, Super Gateway S20P hardware is the same / 超级网关 S20P 硬件相同)
          - Base / 基础: official openwrt/openwrt branch $BRANCH, upstream commit $(cat upstream-commit.txt)
          - Device tree derived from VIKINGYFY/immortalwrt (GPL-2.0-or-later OR MIT)
          - Extra packages / 额外插件: iStore store, quickstart, aurora theme, mini-diskmanager, ttyd, samba4, luci-compat, openssh-sftp-server, luci-app-fullcone, conntrack (conntrack-tools CLI); kernel modules kmod-tun / kmod-nf-conntrack-netlink / kmod-inet-diag / kmod-netlink-diag / kmod-nft-tproxy and coreutils-nohup are in the image; all other kernel modules are built as packages
          - Full-cone NAT (nftables, not in official OpenWrt; patches in fullcone/) is ON by default (IPv4), as is hardware flow offloading (flow_offloading and flow_offloading_hw are both 1; in firewall4 the hardware flag only works together with the software one). Switch: Network → Firewall → FullCone NAT, or the options in /etc/config/firewall. A kernel patch (conntrack events) lets nft_fullcone and nf_conntrack_netlink coexist / 全锥型 NAT（IPv4）和硬件流量卸载默认开启（两个选项都为 1，firewall4 里硬件开关必须和软件开关一起才生效）；开关在"网络 → 防火墙 → FullCone NAT"，也可改 /etc/config/firewall；内核补丁让 nft_fullcone 和 nf_conntrack_netlink 可以共存
          - First-boot defaults / 首次开机默认设置: data partition p7 is mounted at /mnt/data (matched by device, never formatted), UPnP on (plus a first-boot patch for carrier-grade NAT WAN addresses 100.64.x, where the stock miniupnpd init script rejects all port mappings; applied and tested by hand on the maintainer's router, not yet verified from this image), samba is installed without any share / p7 数据分区挂载到 /mnt/data（按设备匹配，不会格式化），UPnP 开（另有首次开机补丁，处理运营商 CGNAT 的 100.64.x 地址下官方 miniupnpd 脚本拒绝所有端口映射的问题；已在维护者路由器上手动验证，尚未从这个镜像验证），samba 已装但没有任何共享
          - iStore installs go straight to the origin server (the mirror repo.istoreos.com was unreliable) / iStore 装包直接走源站（镜像不稳定）
          - Known: browser-based NAT checkers may read "port restricted" although full-cone is on and a raw UDP (RFC 3489) test shows full-cone mapping, and probes from other IPs/ports reach the LAN; the cause of the display value is not established / 已知：网页版 NAT 检测可能显示"端口受限"，但全锥型已开，原始 UDP（RFC 3489）测试是全锥形映射，换 IP/换端口的探测包也能到达局域网；这个显示值的原因尚未查明
          - Flash with sysupgrade WITHOUT keeping settings / 刷机时不要勾选"保留配置"
          - Not affiliated with OpenWrt, CLX, Super Gateway or any plugin author. Not an official release.
          - See the repository README for details / 详见仓库 README
          NOTES
          sed -i 's/^          //' notes.md
          # A previous run built everything and then got HTTP 403 here (cause not established); retry, and the files are
          # also kept as a workflow artifact by the previous step, so a failed publish does not lose the firmware.
          ok=0
          for i in 1 2 3; do
            if gh release create "$TAG" out/* --target "${{ github.sha }}" \
                 --title "CLX S20P OpenWrt ${BRANCH#openwrt-} $BUILD (experimental, untested)" \
                 --notes-file notes.md; then ok=1; break; fi
            echo "release create failed (attempt $i/3); retrying in 30 s"; sleep 30
          done
          [ "$ok" = 1 ] || { echo "RELEASE NOT PUBLISHED: the firmware is in the workflow artifact firmware-$NAME"; exit 1; }
