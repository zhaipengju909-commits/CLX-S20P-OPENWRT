# Raise the cap on netlink receive buffers. nlbwmon (traffic statistics) asks for 524288 bytes, the kernel default cap
# is 212992, which made it log "Netlink receive failure: Out of memory / Unable to dump conntrack" on a busy router.
# This is only an upper limit for what a program may request; it does not allocate anything by itself.
# 提高 netlink 接收缓冲区上限。流量统计(nlbwmon)要 524288 字节,内核默认上限是 212992,繁忙时会报"读不到连接表"。
# 这只是程序可申请的上限,本身不占内存。
net.core.rmem_max=524288
